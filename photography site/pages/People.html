<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Gallery — Cinematic Frames</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">Cinematic Frames</a>
      <div class="nav-links">
        <a href="../index.html#portfolio">Portfolio</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#contact">Contact</a>
      </div>
    </nav>
  </header>
  <section>
    <div class="section-title">
      <h2>People</h2>
      <p>Human stories and street portraits.</p>
    </div>
    <div class="gallery gallery-lightbox">
      <div class="gallery-item" data-title="Cyclists Downtown">
        <img src="../Images/biker.JPG" alt="Cyclists Downtown">
        <div class="photo-title">Cyclists Downtown</div>
      </div>
      <div class="gallery-item" data-title="Market Walk">
        <img src="../Images/people1.jpg" alt="Market Walk">
        <div class="photo-title">Market Walk</div>
      </div>
      <div class="gallery-item" data-title="Evening Crowd">
        <img src="../Images/people2.jpg" alt="Evening Crowd">
        <div class="photo-title">Evening Crowd</div>
      </div>
      <!-- Add more images here the same way -->
    </div>
    <a class="btn" id="back-btn" href="../index.html#portfolio" style="margin-top:40px;display:inline-block;">Back to Featured Work</a>
  </section>

  <div id="lightbox-modal">
  <span class="close-lightbox">&times;</span>
  <a href="#" id="open-original-btn" title="Open original in new tab" target="_blank" rel="noopener noreferrer">
    <span style="font-size: 2.1rem; color: #fff; vertical-align: middle;">&#128065;</span>
  </a>
  <img id="lightbox-img" src="" alt="Expanded photo">
  <div id="lightbox-caption"></div>
</div>

  <script src="../script.js"></script>
</body>
</html>
