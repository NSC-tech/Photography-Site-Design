<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 
    Viewport settings for responsive design. 
    Ensures proper scaling on all devices.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image Viewer — Cinematic Frames</title>
  <!-- 
    Import global styles 
    (for site-wide fonts, colors, resets, etc.)
  -->
  <link rel="stylesheet" href="../style.css" />

  <style>
    /* 
      ========== BODY BASE ==========
      Sets up a clean, seamless dark background 
      with full viewport coverage, aligning content to the center.
    */
    body {
      background: #101013;
      color: #dedede;
      text-align: center;
      margin: 0; padding: 0;
      min-height: 100vh;
    }
    /* 
      ========== HEADER ==========
      Fixed at the top, includes:
      - Branding/home logo (left)
      - "Go Back" navigation (left)
      - Image title, centered above image (centered dynamically with JS)
      Uses flex for left/right, and absolute for title.
      Compact height for maximum image display.
    */
    .viewer-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.91);
      z-index: 2;
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 12px;
      box-sizing: border-box;
    }
    .viewer-header-left {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      min-width: 0;
    }
    /* 
      Logo as clickable branded link (for home).
      Not styled as a button: matches site branding.
    */
    .viewer-logo-link {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.16rem;
      color: #c7a46a;
      text-decoration: none;
      padding: 0 16px 0 4px;
      background: none;
      border: none;
      margin-right: 2px;
      transition: color 0.2s;
      white-space: nowrap;
      display: inline-block;
      height: 38px;
      line-height: 38px;
    }
    .viewer-logo-link:hover, .viewer-logo-link:focus {
      color: #ffe8b6;
      text-decoration: underline;
    }
    /* 
      "Go Back" navigation button: 
      Always visible, styled for clarity, easy to hover/click.
    */
    .viewer-navbtn {
      color: #fff;
      background: #19191c;
      border: 1px solid #c7a46a;
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 0.99rem;
      text-decoration: none;
      margin-left: 0;
      transition: background 0.2s, color 0.2s;
      margin-right: 4px;
      height: 30px; line-height: 20px;
      margin-top: 0; margin-bottom: 0;
      align-self: center;
      display: inline-block;
    }
    .viewer-navbtn:hover, .viewer-navbtn:focus {
      background: #c7a46a; color: #19191c;
    }

    /* 
      ========== TITLE/CAPTION ==========
      The title is absolutely positioned! 
      Dynamic JS ensures its center always matches the image's center, 
      so it is visually always above the image even for portrait shots.
      The fallback left:50%+transform just centers it in rare cases when JS hasn't run yet.
    */
    .viewer-header-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.08rem;
      background: transparent;
      color: #c7a46a;
      letter-spacing: 1.02px;
      border-radius: 15px;
      padding: 3.5px 18px 3.5px 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      margin: 0;
      position: absolute;
      top: 0;
      left: 50%; /* Default: centered if JS not run */
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 5;
      max-width: 65vw;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-header-right { flex: 0 0 auto; min-width: 0; }
    /* 
      ========== MAIN IMAGE VIEWER AREA ==========
      Adds margin so image is never under header (margin-top).
      Uses flex for vertical centering.
    */
    .viewer-img-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-top: 38px;
      min-height: 60vh;
      flex: 1;
    }
    /* 
      MAIN: The image itself.
      - max-width: fills the screen for landscape
      - max-height: fills the available vertical area for portrait
      - width: auto / height: auto allow browser to choose scaling that fits the box, never crops or stretches
    */
    .viewer-img {
      display: block;
      margin: 0 auto 15px auto;
      border-radius: 14px;
      box-shadow: 0 8px 40px 0 #000a;
      background: #242428;
      max-width: 98vw;
      max-height: calc(98vh - 44px); /* header + small gap */
      width: auto;
      height: auto;
    }
    /* 
      Responsive/mobile tweaks: 
      Reduces header/image size on narrow screens.
    */
    @media (max-width: 700px) {
      .viewer-header { height: 32px; padding: 0 2vw; }
      .viewer-logo-link { font-size: 1rem; padding: 0 6px 0 0; line-height: 32px; height: 32px; }
      .viewer-navbtn { font-size: 0.95rem; padding: 2.5px 8px; height: 25px; line-height: 18px; }
      .viewer-header-title { font-size: 0.95rem; padding: 1.5px 8vw; max-width: 70vw; height: 32px;}
      .viewer-img-wrap { margin-top: 32px; }
      .viewer-img { max-height: 49vh; }
    }
  </style>
</head>
<body>
  <!-- 
    HEADER NAVIGATION & TITLE/CAPTION
    - Logo ("Cinematic Frames") is a home link
    - "Go Back" lets user return to gallery/grid
    - Title always *aligned above the image*, no matter aspect ratio or browser width
  -->
  <div class="viewer-header" id="viewer-header">
    <div class="viewer-header-left">
      <a href="../index.html" class="viewer-logo-link">Cinematic Frames</a>
      <a href="javascript:history.back()" class="viewer-navbtn">Go Back</a>
    </div>
    <!-- Centered title, dynamically positioned above image center -->
    <span class="viewer-header-title" id="viewer-caption"></span>
    <div class="viewer-header-right"></div>
  </div>
  <div class="viewer-img-wrap">
    <!-- 
      Loads image and alt from URL params via JS.
      The layout and aspect ratio is managed by CSS.
    -->
    <img class="viewer-img" id="viewer-img" src="" alt="">
  </div>
  <script>
    /*
      JS LOGIC:
      1. Reads image source and title from query string (?src=...&title=...)
      2. Sets image and title, updates page <title> for UX.
      3. On image load and on window resize, calculates horizontal center of image relative to header,
         and moves the title span directly above the image.
      This makes the UI look professional for portrait and landscape—title always "tracks" the photo.
    */

    // Simple helper for grabbing a query string value
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    // Get keys from URL
    const imgSrc = getParam("src");
    const imgTitle = getParam("title");
    const img = document.getElementById("viewer-img");
    const caption = document.getElementById("viewer-caption");

    // Set the caption and page title for tab/history context
    if (imgTitle) {
      caption.textContent = decodeURIComponent(imgTitle);
      document.title = decodeURIComponent(imgTitle) + " — Cinematic Frames";
    }
    // Set the image src and its alt text (for accessibility/UX)
    if (imgSrc) {
      img.src = imgSrc;
      img.alt = imgTitle ? decodeURIComponent(imgTitle) : "";
    }

    /*
      ---- DYNAMIC CAPTION-TO-IMAGE ALIGNMENT ----
      Calculates the center of the photo (no matter aspect ratio or scale)
      and moves the caption so it's always centered above the image.
      - Runs on image load, window resize (including zoom).
      - Robust for grid/portrait/landscape, resizes, and cached images!
    */
    function alignTitleToImage() {
      var header = document.getElementById('viewer-header');
      var title = document.getElementById('viewer-caption');
      var image = document.getElementById('viewer-img');
      if (!header || !title || !image || !image.complete) return;

      // Get the bounding box of both header and image on-screen
      var rect = image.getBoundingClientRect();
      var headerRect = header.getBoundingClientRect();

      // Locate image's horizontal center (relative to the header's left)
      var imgCenter = rect.left + (rect.width / 2) - headerRect.left;

      // Place title so its horizontal center matches that pixel coordinate
      title.style.left = imgCenter + 'px';
      title.style.transform = 'translateX(-50%)';
    }

    // Run alignment after image loads, and whenever window resizes
    function updateAlignment() {
      setTimeout(alignTitleToImage, 0);
    }
    img.onload = updateAlignment;
    window.addEventListener('resize', updateAlignment);
    // If image is cached (already loaded)
    if (img.complete && img.naturalWidth > 0) updateAlignment();

  </script>
</body>
</html>
